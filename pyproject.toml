[project]
name = "mikkidee"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mikael Gueck", email = "gumi@iki.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "jinja2>=3.1.6",
    "requests>=2.34.2",
    "ruff>=0.16.10",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mikkidee = "mikkidee:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
